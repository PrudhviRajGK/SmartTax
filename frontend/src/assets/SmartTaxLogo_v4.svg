<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <defs>
    <!--
      Brand color decision:
      Primary mark bg:  #1e3a8a  (Tailwind blue-900 — not navy-black, not bright)
      Mark gradient end:#2563eb  (Tailwind blue-600 — the "electric" lift)
      Wordmark "SMART": #1e3a8a  (exact same as mark top — perfectly synced)
      Wordmark "tax":   #2563eb  (exact same as mark bottom — synced)
      Result: icon and text feel like one material, not two separate objects.
    -->
    <linearGradient id="v4-bg" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="v4-sh" x1="0" y1="0" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.15"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="v4-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- ── MARK ── -->
  <g transform="translate(0,8)" filter="url(#v4-shadow)">
    <rect width="56" height="56" rx="13" fill="url(#v4-bg)"/>
    <rect width="56" height="56" rx="13" fill="url(#v4-sh)"/>

    <!-- Rupee — uniform 3px, optically centred -->
    <g stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
      <line x1="13" y1="13" x2="37" y2="13"/>
      <line x1="13" y1="20" x2="34" y2="20"/>
      <line x1="20" y1="13" x2="20" y2="44"/>
      <line x1="13" y1="20" x2="36" y2="44"/>
    </g>

    <!-- Integrated check — white ring separates from mark cleanly -->
    <circle cx="43" cy="43" r="9"   fill="white"/>
    <circle cx="43" cy="43" r="7.2" fill="#15803d"/>
    <polyline points="39.2,43.1 42.0,45.8 46.8,40.2"
      stroke="white" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!--
    WORDMARK — optical baseline fix:
    "SMART" font-size 27, "tax" font-size 28.5 (+5.5%)
    This lifts the "t" crossbar to visually align with SMART cap-height.
    Both share the same y baseline (44) so they sit on the same line.
    Letter-spacing -0.5 on both — tight, one unit.
    Colors: SMART = #1e3a8a (matches mark top), tax = #2563eb (matches mark bottom)
  -->
  <text x="70" y="44"
    font-family="'Montserrat','DM Sans','Helvetica Neue',sans-serif"
    font-size="27" font-weight="800" letter-spacing="-0.5" fill="#1e3a8a">SMART</text>

  <text x="160" y="44"
    font-family="'Montserrat','DM Sans','Helvetica Neue',sans-serif"
    font-size="28.5" font-weight="400" letter-spacing="-0.5" fill="#2563eb">tax</text>

  <!-- Tagline — architectural wide tracking -->
  <text x="70" y="60"
    font-family="'Montserrat','DM Sans','Helvetica Neue',sans-serif"
    font-size="7.5" font-weight="600" letter-spacing="3.6" fill="#94a3b8">INDIA'S SIMPLEST TAX ENGINE</text>
</svg>
