<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <defs>
    <!-- On dark bg, the mark needs slightly more brightness to breathe -->
    <linearGradient id="v4d-bg" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="v4d-sh" x1="0" y1="0" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="v4d-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g transform="translate(0,8)" filter="url(#v4d-shadow)">
    <rect width="56" height="56" rx="13" fill="url(#v4d-bg)"/>
    <rect width="56" height="56" rx="13" fill="url(#v4d-sh)"/>
    <g stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
      <line x1="13" y1="13" x2="37" y2="13"/>
      <line x1="13" y1="20" x2="34" y2="20"/>
      <line x1="20" y1="13" x2="20" y2="44"/>
      <line x1="13" y1="20" x2="36" y2="44"/>
    </g>
    <circle cx="43" cy="43" r="9"   fill="rgba(15,23,42,0.65)"/>
    <circle cx="43" cy="43" r="7.2" fill="#22c55e"/>
    <polyline points="39.2,43.1 42.0,45.8 46.8,40.2"
      stroke="white" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- "SMART" — light/white on dark, "tax" — brand blue-400 -->
  <text x="70" y="44"
    font-family="'Montserrat','DM Sans','Helvetica Neue',sans-serif"
    font-size="27" font-weight="800" letter-spacing="-0.5" fill="#f1f5f9">SMART</text>

  <text x="160" y="44"
    font-family="'Montserrat','DM Sans','Helvetica Neue',sans-serif"
    font-size="28.5" font-weight="400" letter-spacing="-0.5" fill="#60a5fa">tax</text>

  <text x="70" y="60"
    font-family="'Montserrat','DM Sans','Helvetica Neue',sans-serif"
    font-size="7.5" font-weight="600" letter-spacing="3.6" fill="#475569">INDIA'S SIMPLEST TAX ENGINE</text>
</svg>
